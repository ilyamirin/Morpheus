[workspace]
members = [
  "crates/morpheus-api",
  "crates/morpheus-cli",
  "crates/morpheus-config",
  "crates/morpheus-conformance",
  "crates/morpheus-core",
  "crates/morpheus-matrix",
  "crates/morpheus-protocol",
  "crates/morpheus-server",
  "crates/morpheus-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
http = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "json", "chrono", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tower = "0.5"
ulid = "1"

morpheus-api = { path = "crates/morpheus-api" }
morpheus-cli = { path = "crates/morpheus-cli" }
morpheus-config = { path = "crates/morpheus-config" }
morpheus-conformance = { path = "crates/morpheus-conformance" }
morpheus-core = { path = "crates/morpheus-core" }
morpheus-matrix = { path = "crates/morpheus-matrix" }
morpheus-protocol = { path = "crates/morpheus-protocol" }
morpheus-server = { path = "crates/morpheus-server" }
morpheus-store = { path = "crates/morpheus-store" }
