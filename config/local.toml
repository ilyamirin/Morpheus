[instance]
instance_id = "shop.example"
matrix_server_name = "shop.example"
application_service_id = "io.marketplace.shop"
catalog_room_id = "!catalog:shop.example"
catalog_room_alias = "#marketplace-catalog:shop.example"
order_room_alias_prefix = "#marketplace-order-"
protocol_versions = ["0.1"]
payment_adapters = ["mock"]
entitlement_types = ["booking_slot", "license_key", "external_entitlement"]

[appservice]
homeserver_url = "http://localhost:8008"
url = "http://morpheus-server:8080"
sender_localpart = "market"
namespace_prefix = "market_"
homeserver_token = "dev-homeserver-token"
appservice_token = "dev-appservice-token"
bootstrap_rooms = false

[database]
url = "postgres://morpheus:morpheus@localhost:5432/morpheus"

[admin]
bind = "127.0.0.1:8080"
bearer_token_env = "MORPHEUS_ADMIN_TOKEN"

[auth]
seller_token_env = "MORPHEUS_SELLER_TOKEN"
buyer_token_env = "MORPHEUS_BUYER_TOKEN"

[[allowlist.instances]]
instance_id = "shop.example"
capabilities = ["catalog", "orders", "indexing"]
status = "active"
catalog_room_alias = "#marketplace-catalog:shop.example"
homeserver_url = "http://localhost:8008"
morpheus_url = "http://127.0.0.1:8080"

[[allowlist.instances]]
instance_id = "arbiter.example"
capabilities = ["arbitration"]
status = "active"
catalog_room_alias = "#marketplace-catalog:other.example"
homeserver_url = "http://localhost:8009"
morpheus_url = "http://127.0.0.1:8081"

[payments.evm_escrow]
enabled = false
chain_id = 31337
rpc_url_env = "MORPHEUS_EVM_RPC_URL"
escrow_contract = "0x0000000000000000000000000000000000000001"
default_token = "0x0000000000000000000000000000000000000002"
confirmations = 1
poll_interval_secs = 2
deployments_path = "contracts/deployments/local.json"

[[payments.evm_escrow.tokens]]
symbol = "USDC"
contract = "0x0000000000000000000000000000000000000002"
decimals = 6
currency = "USDC"
